name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'ios-v*'

jobs:
  beta:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
      VITE_POSTHOG_SESSION_REPLAY: ${{ secrets.VITE_POSTHOG_SESSION_REPLAY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_KEYCHAIN_NAME: ${{ github.run_id }}.keychain
      MATCH_KEYCHAIN_PASSWORD: ${{ github.run_id }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version number from release tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag=$(git describe --tags --match 'v*' --match 'ios-v*' --abbrev=0 2>/dev/null || true)
          fi
          case "$tag" in
            ios-v*) version="${tag#ios-v}" ;;
            v*) version="${tag#v}" ;;
            *)
              echo "Kein gültiger Release-Tag gefunden (v* oder ios-v*), breche ab." >&2
              exit 1
              ;;
          esac
          echo "Version aus Tag $tag: $version"
          echo "VERSION_NUMBER=$version" >> "$GITHUB_ENV"

      - name: Select latest available Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Create temporary CI keychain
        run: |
          security create-keychain -p "$MATCH_KEYCHAIN_PASSWORD" "$MATCH_KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$MATCH_KEYCHAIN_NAME"
          security unlock-keychain -p "$MATCH_KEYCHAIN_PASSWORD" "$MATCH_KEYCHAIN_NAME"
          security list-keychains -d user -s "$MATCH_KEYCHAIN_NAME" $(security list-keychains -d user | sed 's/"//g')

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install JS dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install CocoaPods
        run: cd ios/App && pod install

      - name: Build and upload to TestFlight
        run: bundle exec fastlane beta

      - name: Delete temporary CI keychain
        if: always()
        run: security delete-keychain "$MATCH_KEYCHAIN_NAME" || true
