name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      ota_channel:
        description: 'Capgo OTA channel baked into the native shell'
        type: choice
        options:
          - staging
          - production
        default: staging
  push:
    tags:
      - 'v*'
      - 'ios-v*'
      - 'release-v*'
      - 'release-ios-v*'

jobs:
  beta:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: 'https://eu.i.posthog.com'
      VITE_POSTHOG_SESSION_REPLAY: ${{ secrets.VITE_POSTHOG_SESSION_REPLAY }}
      # Pro / native API endpoints (public URLs — baked into the Capacitor web bundle)
      VITE_BILLING_ENABLED: 'true'
      VITE_GEMINI_PROXY_URL: 'https://hivelyy.netlify.app/api/gemini'
      VITE_STRIPE_API_ORIGIN: 'https://hivelyy.netlify.app'
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_KEYCHAIN_NAME: ${{ github.run_id }}.keychain
      MATCH_KEYCHAIN_PASSWORD: ${{ github.run_id }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve Capgo OTA channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            channel="${{ github.event.inputs.ota_channel }}"
          else
            case "${GITHUB_REF_NAME}" in
              release-v*|release-ios-v*) channel=production ;;
              *) channel=staging ;;
            esac
          fi
          case "$channel" in
            staging|production) ;;
            *)
              echo "Invalid OTA channel: $channel" >&2
              exit 1
              ;;
          esac
          echo "VITE_OTA_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "Capgo OTA channel: $channel"

      - name: Determine version number from release tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag=$(git describe --tags --match 'v*' --match 'ios-v*' --match 'release-v*' --match 'release-ios-v*' --abbrev=0 2>/dev/null || true)
          fi
          case "$tag" in
            release-ios-v*) version="${tag#release-ios-v}" ;;
            release-v*) version="${tag#release-v}" ;;
            ios-v*) version="${tag#ios-v}" ;;
            v*) version="${tag#v}" ;;
            *)
              echo "Kein gültiger Release-Tag gefunden (v*, ios-v*, release-v*, release-ios-v*), breche ab." >&2
              exit 1
              ;;
          esac
          echo "Version aus Tag $tag: $version"
          # App Store: CFBundleShortVersionString may have at most 3 integer parts
          parts=$(echo "$version" | tr '.' '\n' | wc -l | tr -d ' ')
          if [ "$parts" -gt 3 ]; then
            echo "Ungültige iOS-Marketing-Version '$version' ($parts Teile)." >&2
            echo "Apple erlaubt max. drei Zahlen (z.B. 0.6.10), nicht 0.6.9.2." >&2
            exit 1
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "VERSION_NUMBER '$version' muss nur aus Zahlen und Punkten bestehen." >&2
            exit 1
          fi
          echo "VERSION_NUMBER=$version" >> "$GITHUB_ENV"

      - name: Select latest available Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Create temporary CI keychain
        run: |
          security create-keychain -p "$MATCH_KEYCHAIN_PASSWORD" "$MATCH_KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$MATCH_KEYCHAIN_NAME"
          security unlock-keychain -p "$MATCH_KEYCHAIN_PASSWORD" "$MATCH_KEYCHAIN_NAME"
          security list-keychains -d user -s "$MATCH_KEYCHAIN_NAME" $(security list-keychains -d user | sed 's/"//g')

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Require Vite Supabase env (avoid Local-Only shell)
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY — native shell would be Local-Only." >&2
            exit 1
          fi

      - name: Install JS dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Verify build embeds Supabase (not Local-Only)
        run: |
          set -euo pipefail
          HOST=$(node -e "try{process.stdout.write(new URL(process.env.VITE_SUPABASE_URL).host)}catch{process.exit(1)}")
          if ! grep -R --quiet --fixed-strings "$HOST" dist/; then
            echo "Built dist/ does not contain Supabase host — refusing Local-Only shell." >&2
            exit 1
          fi

      - name: Set Capgo OTA channel
        run: node scripts/set-ota-channel.mjs "$VITE_OTA_CHANNEL"

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install CocoaPods
        run: cd ios/App && pod install

      - name: Build and upload to TestFlight
        run: bundle exec fastlane beta

      - name: Delete temporary CI keychain
        if: always()
        run: security delete-keychain "$MATCH_KEYCHAIN_NAME" || true
