name: OTA Publish

on:
  workflow_dispatch:
    inputs:
      channels:
        description: 'Comma-separated channels (staging,production)'
        required: false
        default: 'staging,production'
  push:
    tags:
      - 'ota-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: 'https://eu.i.posthog.com'
      VITE_POSTHOG_SESSION_REPLAY: ${{ secrets.VITE_POSTHOG_SESSION_REPLAY }}
      VITE_BILLING_ENABLED: 'true'
      VITE_GEMINI_PROXY_URL: 'https://hivelyy.netlify.app/api/gemini'
      VITE_STRIPE_API_ORIGIN: 'https://hivelyy.netlify.app'
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine OTA version from tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            echo "workflow_dispatch without tag — use package.json version"
            tag="ota-v$(node -p "require('./package.json').version")"
          fi
          case "$tag" in
            ota-v*) version="${tag#ota-v}" ;;
            *)
              echo "Tag must look like ota-v0.6.12 (got: $tag)" >&2
              exit 1
              ;;
          esac
          if ! echo "$version" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "Invalid OTA version '$version'" >&2
            exit 1
          fi
          echo "OTA_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing OTA version $version"

      - name: Require Netlify Blobs credentials
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "Missing NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID GitHub secrets." >&2
            exit 1
          fi

      - name: Require Vite Supabase env (avoid Local-Only OTA)
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY — OTA would ship Local-Only mode." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Verify build embeds Supabase (not Local-Only)
        run: |
          set -euo pipefail
          HOST=$(node -e "try{process.stdout.write(new URL(process.env.VITE_SUPABASE_URL).host)}catch{process.exit(1)}")
          if ! grep -R --quiet --fixed-strings "$HOST" dist/; then
            echo "Built dist/ does not contain Supabase host — refusing to publish Local-Only OTA." >&2
            exit 1
          fi
          echo "Supabase host present in dist/"

      - name: Zip Capgo bundle
        id: zip
        run: |
          set -euo pipefail
          OUT=$(npx @capgo/cli bundle zip ch.hively.app \
            --path dist \
            --bundle "$OTA_VERSION" \
            --json \
            --no-code-check)
          echo "$OUT" | tee /tmp/capgo-zip.json
          CHECKSUM=$(node -e "const j=require('/tmp/capgo-zip.json'); if(!j.checksum) process.exit(1); process.stdout.write(j.checksum)")
          ZIP_PATH=$(node -e "const j=require('/tmp/capgo-zip.json'); const f=j.filename||j.path||''; if(!f) process.exit(1); process.stdout.write(f)")
          test -f "$ZIP_PATH"
          echo "CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "ZIP=$ZIP_PATH checksum=$CHECKSUM"

      - name: Upload to Netlify Blobs
        run: |
          CHANNELS="${{ github.event.inputs.channels || 'staging,production' }}"
          node scripts/ota-publish.mjs \
            --version "$OTA_VERSION" \
            --zip "$ZIP_PATH" \
            --checksum "$CHECKSUM" \
            --channels "$CHANNELS"
