name: Temp - Export public signing cert

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore and export public certificate (PEM)
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          keytool -exportcert -rfc \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            -keystore /tmp/release.keystore \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -file /tmp/hively-public-cert.pem
          rm -f /tmp/release.keystore

      - name: Upload public certificate as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hively-public-cert
          path: /tmp/hively-public-cert.pem
          retention-days: 1
