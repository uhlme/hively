<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hively – Anmeldung</title>
  <style>
    :root {
      --bg: #1a1510;
      --text: #f6efe4;
      --muted: #c4b8a8;
      --accent: #e08a3c;
      --btn-bg: #e08a3c;
      --btn-text: #1a1510;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, #3a2a18 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      text-align: center;
    }
    main { max-width: 22rem; }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 1.25rem;
      color: var(--muted);
      line-height: 1.45;
      font-size: 1rem;
    }
    .hint {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.65rem 1rem;
      border: 1px solid rgba(224, 138, 60, 0.45);
      border-radius: 0.65rem;
      color: var(--accent);
      font-size: 0.95rem;
    }
    .actions {
      display: grid;
      gap: 0.75rem;
      margin-top: 0.25rem;
    }
    .actions[hidden] { display: none; }
    a.btn {
      display: inline-block;
      padding: 0.85rem 1.1rem;
      border-radius: 0.75rem;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
    }
    a.btn:active { filter: brightness(0.95); }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Hively</h1>
    <p id="message">Einen Moment…</p>
    <div id="actions" class="actions" hidden>
      <a id="open-app" class="btn" href="#">In der App öffnen</a>
    </div>
    <p class="hint">Falls die App nicht öffnet: Tippe auf den Button oder schliess dieses Fenster (✕).</p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var title = document.getElementById('title');
      var message = document.getElementById('message');
      var actions = document.getElementById('actions');
      var openApp = document.getElementById('open-app');
      var error = params.get('error');

      // SFSafariViewController / Custom Tabs cannot use custom-scheme URLs as
      // Supabase redirect targets. This HTTPS bridge bounces into the app.
      // Do not put the OAuth code into a browser fallback URL.
      params.delete('native');
      var qs = params.toString();
      var scheme = 'ch.hively.app';
      var deep = scheme + '://auth' + (qs ? '?' + qs : '');
      var androidIntent =
        'intent://auth' + (qs ? '?' + qs : '') +
        '#Intent;scheme=' + scheme + ';package=ch.hively.app;end';

      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      var openHref = isAndroid ? androidIntent : deep;

      if (error) {
        title.textContent = 'Anmeldung abgebrochen';
        message.textContent = 'Die Google-Anmeldung wurde nicht abgeschlossen. Schliess dieses Fenster, um zur App zurückzukehren.';
        return;
      }

      title.textContent = 'Anmeldung läuft';
      message.textContent = isAndroid
        ? 'Du wirst in die Hively-App geleitet. Tippe auf den Button, falls nichts passiert.'
        : 'Du wirst gleich zurück in die Hively-App geleitet.';

      openApp.setAttribute('href', openHref);
      actions.hidden = false;

      function bounceToApp() {
        try {
          window.location.href = openHref;
        } catch (e) {
          /* user can tap the button */
        }
      }

      // Android Chrome Custom Tabs often ignore plain custom-scheme navigations;
      // Intent URLs (same pattern as join.html) open the app reliably.
      // Retry once — the first attempt can race with Custom Tabs settling.
      setTimeout(bounceToApp, 250);
      setTimeout(bounceToApp, 1200);
    })();
  </script>
</body>
</html>
