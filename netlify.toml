[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

# Gemini 2.5 can exceed the default 10s (thinking + recommendation text).
[functions."gemini"]
  timeout = 26

# AI proxy — keep the Gemini key server-side only
[[redirects]]
  from = "/api/gemini"
  to = "/.netlify/functions/gemini"
  status = 200

# Stripe billing (must be before SPA fallback)
[[redirects]]
  from = "/api/stripe/checkout"
  to = "/.netlify/functions/stripe-checkout"
  status = 200

[[redirects]]
  from = "/api/stripe/portal"
  to = "/.netlify/functions/stripe-portal"
  status = 200

[[redirects]]
  from = "/api/stripe/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(self)"

# Legal pages (static files under public/) — force trailing slash before SPA fallback
[[redirects]]
  from = "/privacy"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/impressum"
  to = "/impressum/"
  status = 301

[[redirects]]
  from = "/agb"
  to = "/agb/"
  status = 301

[[redirects]]
  from = "/delete-account"
  to = "/delete-account/"
  status = 301

